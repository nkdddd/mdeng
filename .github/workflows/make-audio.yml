# 🎙️ 자연스러운 목소리 녹음 만들기
# 저장소의 Actions 탭 → "목소리 녹음 만들기" → Run workflow 버튼을 누르면
# AI 음성(Microsoft 신경망 음성)으로 audio/*.mp3와 js/clips.js를 만들어 이 브랜치에 올려요.
# 이미 있는 녹음은 건너뛰고 새 문구만 만들어요. 목소리를 바꾸면 모두 새로 만들어요.
name: 목소리 녹음 만들기

on:
  workflow_dispatch:
    inputs:
      voice:
        description: '목소리'
        type: choice
        default: 'ko-KR-SunHiNeural'
        options:
          - ko-KR-SunHiNeural    # 선희 (여자)
          - ko-KR-InJoonNeural   # 인준 (남자)
      rate:
        description: '말 빠르기 (아이용 기본 -8%, 더 천천히는 -15%)'
        type: string
        default: '-8%'
      force:
        description: '이미 있는 녹음도 모두 다시 만들기'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: make-audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: 녹음 만들기
        id: make
        continue-on-error: true   # 몇 개가 실패해도 만든 녹음은 올려요 (못 만든 말은 기기 목소리로 읽어요)
        run: |
          npm run audio -- --voice "${{ inputs.voice }}" --rate "${{ inputs.rate }}" ${{ inputs.force && '--force' || '' }}

      - name: 저장소에 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add audio js/clips.js
          if git diff --cached --quiet; then
            echo "바뀐 녹음이 없어요."
            exit 0
          fi
          git commit -m "Update voice clips (${{ inputs.voice }}, ${{ inputs.rate }})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: 결과
        if: always()
        run: |
          echo "### 🎙️ 녹음 결과" >> "$GITHUB_STEP_SUMMARY"
          echo "- 목소리: ${{ inputs.voice }} · 빠르기 ${{ inputs.rate }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 녹음 파일: $(ls audio/*.mp3 2>/dev/null | wc -l)개" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.make.outcome }}" != "success" ]; then
            echo "- ⚠️ 일부 문구를 만들지 못했어요. 한 번 더 실행하면 빠진 것만 다시 만들어요." >> "$GITHUB_STEP_SUMMARY"
          fi
