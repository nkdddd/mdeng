<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- 🔒 잘못 터치해도 화면이 확대되지 않게 (두 번 톡 · 두 손가락 벌리기) -->
<style>html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}</style>
<script>(function(){var no=function(e){e.preventDefault();};
  ["gesturestart","gesturechange","gestureend"].forEach(function(t){document.addEventListener(t,no,{passive:false});});
  document.addEventListener("touchmove",function(e){if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});})();</script>

<title>또박또박 받아쓰기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="css/style.css?v=4">
<link rel="stylesheet" href="css/gocatch.css?v=3">
</head>
<body>
<header class="bar">
  <button class="bar-btn" id="homeBtn" aria-label="지도로 돌아가기" hidden>🗺️<span class="bar-txt"> 지도</span></button>
  <button class="brand who-chip" id="whoBtn" aria-label="공부하는 친구 바꾸기"><span id="whoAvatar">🐻</span> <span id="whoName">또박또박</span></button>
  <button class="bar-btn icon" id="voiceBtn" aria-label="목소리 설정">⚙️</button>
  <span class="stars" id="starPill" aria-label="모은 별">⭐ <b id="starCount">0</b></span>
</header>

<main id="app" aria-live="polite"></main>

<div id="toast" class="toast" role="status" hidden></div>

<div id="splash" class="splash">
  <div class="splash-in">
    <div class="splash-bear" aria-hidden="true">🐻✏️</div>
    <h1 class="title">또박또박 <span>받아쓰기</span></h1>
    <p>소리를 듣고, 글자의 비밀을 찾는 놀이</p>
    <p class="who-q">누가 공부할까?</p>
    <div class="who-list" id="whoList"></div>
    <p class="splash-note">소리가 나와요. 스피커를 켜 주세요 🔈</p>
    <div class="splash-acct" id="splashAcct"></div>
  </div>
</div>

<script src="js/firebase-config.js"></script>
<script src="js/store.js"></script>
<script src="js/tapbattle.js?v=12"></script>
<script src="js/social.js?v=2"></script>
<script src="js/pokedex.js"></script>
<script src="js/data.js"></script>
<script src="js/grade.js"></script>
<script src="js/spell.js"></script>
<script src="js/math.js"></script>
<script src="js/voice.js"></script>
<script src="js/clips.js"></script>
<script src="js/sfx.js"></script>
<script src="js/fx.js"></script>
<script src="js/gocatch.js?v=3"></script>
<script src="js/app.js?v=16"></script>
</body>
</html>
