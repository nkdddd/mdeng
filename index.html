<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>또박또박 받아쓰기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="bar">
  <button class="bar-btn" id="homeBtn" aria-label="지도로 돌아가기" hidden>🗺️ 지도</button>
  <button class="brand who-chip" id="whoBtn" aria-label="공부하는 친구 바꾸기"><span id="whoAvatar">🐻</span> <span id="whoName">또박또박</span></button>
  <button class="bar-btn icon" id="voiceBtn" aria-label="목소리 설정">⚙️</button>
  <span class="stars" id="starPill" aria-label="모은 별">⭐ <b id="starCount">0</b></span>
</header>

<main id="app" aria-live="polite"></main>

<div id="toast" class="toast" role="status" hidden></div>

<div id="splash" class="splash">
  <div class="splash-in">
    <div class="splash-bear" aria-hidden="true">🐻✏️</div>
    <h1 class="title">또박또박 <span>받아쓰기</span></h1>
    <p>소리를 듣고, 글자의 비밀을 찾는 놀이</p>
    <p class="who-q">누가 공부할까?</p>
    <div class="who-list" id="whoList"></div>
    <p class="splash-note">소리가 나와요. 스피커를 켜 주세요 🔈</p>
  </div>
</div>

<script src="js/firebase-config.js"></script>
<script src="js/store.js"></script>
<script src="js/data.js"></script>
<script src="js/voice.js"></script>
<script src="js/clips.js"></script>
<script src="js/app.js"></script>
</body>
</html>
