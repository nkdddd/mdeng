<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>또박또박 받아쓰기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="bar">
  <button class="bar-btn" id="homeBtn" aria-label="지도로 돌아가기" hidden>🗺️ 지도</button>
  <span class="brand">또박또박</span>
  <span class="stars" id="starPill" aria-label="모은 별">⭐ <b id="starCount">0</b></span>
</header>

<main id="app" aria-live="polite"></main>

<div id="toast" class="toast" role="status" hidden></div>

<div id="splash" class="splash">
  <div class="splash-in">
    <div class="splash-bear" aria-hidden="true">🐻✏️</div>
    <h1 class="title">또박또박 <span>받아쓰기</span></h1>
    <p>소리를 듣고, 글자의 비밀을 찾는 놀이</p>
    <button class="btn primary big" id="startBtn">▶ 시작!</button>
    <p class="splash-note">소리가 나와요. 스피커를 켜 주세요 🔈</p>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
